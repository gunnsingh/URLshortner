<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
  <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-semibold text-center text-indigo-700 mb-6">🔗 URL Shortener</h1>

    <form method="post" th:action="@{/shorten}" class="flex flex-col space-y-4">
      <input
        type="text"
        name="url"
        placeholder="Enter your long URL..."
        required
        class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
      />

      <button
        type="submit"
        class="bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-200"
      >
        Shorten URL
      </button>
    </form>

    <div th:if="${shortened}" class="mt-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Your shortened link:</label>
      <div class="flex">
        <input
          type="text"
          th:value="${shortened}"
          readonly
          class="flex-1 border border-gray-300 rounded-l-md px-4 py-2 bg-gray-50 text-gray-700 focus:outline-none"
        />
        <button
          type="button"
          onclick="navigator.clipboard.writeText(document.querySelector('[th\\\\:value]').value)"
          class="bg-green-500 text-white px-4 rounded-r-md hover:bg-green-600 transition duration-200"
        >
          Copy
        </button>
      </div>
    </div>
  </div>
</body>
</html>
